name: MLOps CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel Cython
        python -m pip install numpy==1.26.4
        
        # Bypass build isolation exclusively for the Cython/C-extension library
        python -m pip install --no-build-isolation scikit-surprise==1.1.3
        
        # Safely install the rest of the project
        python -m pip install -r requirements.txt

    - name: Run Pytest Suite
      #Automatically discovers and runs tests/test_inference.py
      run: |
        pytest tests/ -v