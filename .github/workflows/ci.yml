name: MLOps CI Pipeline

on:
  push:
    branches: ["main", "master", "2.0", "2.1", "2.2"]
  pull_request:
    branches: ["main", "master", "2.0", "2.1", "2.2"]

jobs:
  validate:
    name: Lint, type-check, quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 src scripts tests
      - name: Format check
        run: python -m black --check --diff src scripts tests
      - name: Type check
        run: python -m mypy src scripts --config-file mypy.ini
      - name: Model-quality gate
        run: PYTHONPATH=. python scripts/run_quality_gate.py

  build-and-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Import check
        run: |
          python -c "import src.serving.fastapi_app; import src.evaluation.ranking; import src.models.svd_model; print('imports ok')"
      - name: Test suite
        run: PYTHONPATH=. pytest tests/ -v
      - name: Docker build
        run: docker build -t netflix-recommender:ci .
      - name: Create CI runtime fixtures
        run: PYTHONPATH=. python tests/create_ci_runtime.py
      - name: Docker smoke test
        env:
          API_KEY: ci-test-key
        run: |
          docker run -d --name netflix-recommender-ci -p 8000:8000 \
            -e API_KEY="$API_KEY" \
            -v "$GITHUB_WORKSPACE/.ci-runtime/data:/app/data:ro" \
            -v "$GITHUB_WORKSPACE/.ci-runtime/artifacts:/app/artifacts:ro" \
            netflix-recommender:ci
          cleanup() { docker rm -f netflix-recommender-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health >/dev/null && break
            if [ "$i" -eq 30 ]; then docker logs netflix-recommender-ci; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/ready
          curl -fsS -X POST http://localhost:8000/recommend \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '{"user_id":"1","top_n":2}'
