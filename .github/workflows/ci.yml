name: MLOps CI Pipeline

on:
  push:
    branches: ["main", "master", "2.0"]
  pull_request:
    branches: ["main", "master", "2.0"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build -t netflix-recommender:ci .

      - name: Create CI runtime fixtures
        run: |
          python tests/create_ci_runtime.py

      - name: Smoke test Docker container
        run: |
          docker run -d \
            --name netflix-recommender-ci \
            -p 8000:8000 \
            -v "$GITHUB_WORKSPACE/.ci-runtime/data:/app/data:ro" \
            -v "$GITHUB_WORKSPACE/.ci-runtime/artifacts:/app/artifacts:ro" \
            netflix-recommender:ci

          cleanup() {
            docker rm -f netflix-recommender-ci >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Waiting for container..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Health check passed."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Container failed to start."
              docker logs netflix-recommender-ci
              exit 1
            fi

            sleep 2
          done

          echo "Checking readiness..."

          if ! curl -fsS http://localhost:8000/ready; then
            echo "Readiness check failed."
            docker logs netflix-recommender-ci
            exit 1
          fi

          echo ""
          echo "Readiness check passed."

          echo "Testing real inference path..."

          if ! curl -fsS -X POST \
            http://localhost:8000/recommend \
            -H "Content-Type: application/json" \
            -d '{"user_id":"1","top_n":2}'; then
            echo ""
            echo "Recommendation smoke test failed."
            docker logs netflix-recommender-ci
            exit 1
          fi

          echo ""
          echo "Docker inference smoke test passed."
