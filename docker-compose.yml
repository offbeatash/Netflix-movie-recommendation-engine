services:
  netflix-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: netflix-recommender:latest
    container_name: netflix-api
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:7860}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
